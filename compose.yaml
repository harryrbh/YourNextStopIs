# docker-compose.yml describes TWO containers that need to run
# together: the database, and our app. Run both with:
#     docker compose up --build
#
# See SETUP_GUIDE.md for a line-by-line explanation of everything
# below if you're new to Docker.

services:
  db:
    image: postgres:16          # use the official Postgres image, don't build our own
    environment:
      POSTGRES_DB: city_breaks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data   # keep the database on disk, not just in memory
    ports:
      - "5432:5432"

  app:
    build: .                     # build the Dockerfile in this folder
    depends_on:
      - db
    environment:
      POSTGRES_HOST: db          # inside Docker, containers reach each other by service name
      POSTGRES_PORT: "5432"
      POSTGRES_DB: city_breaks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8501:8501"

volumes:
  pgdata:
